<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <style>
    .st0{fill:#FFFFFF;}
    .st1{fill:#F3F3F3;}
    .st2{fill:#E1E1E1;}
    .st3{fill:#3498DB;}
    .st4{fill:#2980B9;}
    .st5{fill:#ECF0F1;}
    .st6{fill:#BDC3C7;}
    .st7{fill:#95A5A6;}
    .st8{fill:#8E44AD;}
    .st9{fill:#9B59B6;}
  </style>
  
  <!-- Background Elements -->
  <circle cx="250" cy="250" r="200" fill="rgba(255,255,255,0.1)"/>
  <circle cx="400" cy="150" r="40" fill="rgba(255,255,255,0.1)"/>
  <circle cx="100" cy="350" r="25" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Dashboard/Analytics visualization -->
  <rect x="100" y="150" width="300" height="200" class="st0" rx="10"/>
  
  <!-- Dashboard Header -->
  <rect x="100" y="150" width="300" height="40" class="st3" rx="10 10 0 0"/>
  <circle cx="125" cy="170" r="10" class="st8"/>
  <rect x="145" y="165" width="60" height="10" class="st0" rx="3"/>
  <rect x="350" y="165" width="30" height="10" class="st0" rx="3"/>
  
  <!-- Dashboard Content - Analytics -->
  <rect x="120" y="210" width="100" height="70" class="st5" rx="5"/>
  <rect x="120" y="220" width="100" height="2" class="st6"/>
  <rect x="130" y="230" width="80" height="5" class="st7" rx="2"/>
  <rect x="130" y="245" width="30" height="25" class="st3" rx="2"/>
  <rect x="170" y="245" width="30" height="15" class="st9" rx="2"/>
  
  <!-- Dashboard Content - Chart -->
  <rect x="230" y="210" width="150" height="70" class="st5" rx="5"/>
  <rect x="230" y="220" width="150" height="2" class="st6"/>
  <circle cx="260" cy="250" r="20" class="st3"/>
  <path d="M260 250 L260 230 A20 20 0 0 1 280 250 Z" class="st8"/>
  <path d="M260 250 L280 250 A20 20 0 0 1 260 270 Z" class="st9"/>
  <rect x="295" y="235" width="70" height="5" class="st7" rx="2"/>
  <rect x="295" y="250" width="70" height="5" class="st7" rx="2"/>
  <rect x="295" y="265" width="70" height="5" class="st7" rx="2"/>
  
  <!-- Dashboard Content - Bottom Widgets -->
  <rect x="120" y="290" width="70" height="40" class="st5" rx="5"/>
  <rect x="200" y="290" width="70" height="40" class="st5" rx="5"/>
  <rect x="280" y="290" width="70" height="40" class="st5" rx="5"/>
  <rect x="130" y="300" width="50" height="5" class="st3" rx="2"/>
  <rect x="130" y="315" width="30" height="5" class="st7" rx="2"/>
  <rect x="210" y="300" width="50" height="5" class="st8" rx="2"/>
  <rect x="210" y="315" width="30" height="5" class="st7" rx="2"/>
  <rect x="290" y="300" width="50" height="5" class="st9" rx="2"/>
  <rect x="290" y="315" width="30" height="5" class="st7" rx="2"/>
  
  <!-- Form Element -->
  <rect x="150" y="370" width="200" height="80" class="st0" rx="10"/>
  <rect x="170" y="385" width="160" height="15" class="st5" rx="5"/>
  <rect x="170" y="410" width="100" height="15" class="st5" rx="5"/>
  <rect x="280" y="410" width="50" height="30" class="st3" rx="5"/>
  <rect x="290" y="420" width="30" height="10" class="st0" rx="2"/>
  
  <!-- Decorative Elements - People -->
  <!-- Person 1 -->
  <circle cx="80" cy="120" r="12" class="st8"/> <!-- Head -->
  <rect x="68" y="132" width="24" height="35" class="st9" rx="5"/> <!-- Body -->
  <line x1="68" y1="142" x2="55" y2="160" stroke="#8E44AD" stroke-width="4"/> <!-- Left Arm -->
  <line x1="92" y1="142" x2="105" y2="160" stroke="#8E44AD" stroke-width="4"/> <!-- Right Arm -->
  
  <!-- Person 2 -->
  <circle cx="430" cy="220" r="12" class="st3"/> <!-- Head -->
  <rect x="418" y="232" width="24" height="35" class="st4" rx="5"/> <!-- Body -->
  <line x1="418" y1="242" x2="405" y2="260" stroke="#2980B9" stroke-width="4"/> <!-- Left Arm -->
  <line x1="442" y1="242" x2="455" y2="260" stroke="#2980B9" stroke-width="4"/> <!-- Right Arm -->
</svg> 